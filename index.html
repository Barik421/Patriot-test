<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f0" />
    <title>Патріот чи зрадойоб? — Тест на патріота України</title>
    <meta
      name="description"
      content="Ти патріот, недопатріот чи справжній зрадойоб? Пройди безкоштовний жартівливий тест на патріота України з 20 випадкових запитань та поділися результатом!"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="uk_UA" />
    <meta
      property="og:title"
      content="Патріот чи зрадойоб? — Тест на патріота"
    />
    <meta
      property="og:description"
      content="20 запитань. 4 типажі. Багато самоіронії. Дізнайся свій рівень зради та поділися з друзями."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon-ukraine.svg" />
    <script>
      try {
        const t = localStorage.getItem("patriot:theme");
        document.documentElement.dataset.theme =
          t === "light" || t === "dark"
            ? t
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
      if (location.hash === "#quiz" || location.hash.startsWith("#result=")) {
        const m = document.createElement("meta");
        m.name = "robots";
        m.content = "noindex,follow";
        document.head.appendChild(m);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
